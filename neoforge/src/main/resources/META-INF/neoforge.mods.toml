modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
issueTrackerURL = "https://github.com/${sources}/issues"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
logoBlur=false
authors="${neoforge_mod_authors}"
description='''
${mod_description}
'''
enumExtensions="brewinandchewin_extensions.json"

[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[accessTransformers]]
file="${mod_id}.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${neoforge_loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${neoforge_minecraft_version_range}"
ordering="NONE"
side="BOTH"


[[dependencies.${mod_id}]]
modId="farmersdelight"
mandatory=true
versionRange="${farmers_delight_range}"
ordering="NONE"
side="BOTH"


[[dependencies.${mod_id}]]
modId="greenhouseconfig"
mandatory=true
versionRange="${neoforge_greenhouse_config_range}"
ordering="NONE"
side="BOTH"


[[dependencies.${mod_id}]]
modId="nomansland"
type="optional"
versionRange="${no_mans_land_range}"
ordering="AFTER"
side="BOTH"
